# Configuração vem do ambiente. Variável obrigatória não tem default:
# sem ela a aplicação não sobe. Lista completa e exemplos em .env.example.
spring:
  application:
    name: nexa-finance-api
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      # Com o banco fora, o health responde DOWN em ~2 s em vez de esperar os 30 s padrão.
      connection-timeout: 2000  # ms: o Hikari recebe o long direto, sem conversão de Duration
      data-source-properties:
        # Sem o "Detail" do servidor nas exceções: numa violação de UNIQUE ele traz o valor
        # (e-mail, hash de credencial), que iria parar no log do Hibernate e no do erro 500.
        logServerErrorDetail: false
  flyway:
    locations: classpath:db/migration
  jpa:
    # O schema é do Flyway; o Hibernate só confere que as entidades batem com ele.
    hibernate:
      ddl-auto: validate
    # Sem sessão do JPA aberta durante a escrita da resposta: consulta fica no serviço, em transação.
    open-in-view: false

management:
  endpoints:
    web:
      # Sem o índice /actuator (links dos endpoints): fora o health, o Actuator não existe na web.
      discovery:
        enabled: false
      exposure:
        # Só o health. Qualquer outro endpoint do Actuator não existe na web.
        include: health
  endpoint:
    health:
      # Público: só o estado agregado, sem detalhes nem componentes (não vaza topologia).
      show-details: never
      show-components: never
      # Sem Kubernetes: as probes só acrescentariam "groups" ao corpo público, que deve ter só o status.
      probes:
        enabled: false
  observations:
    enable:
      # A observação da cadeia do Spring Security abre um trace novo, sem pai, no dispatch de
      # ERROR, e o MDC do log passaria a apontar para ele. Sem exporter, esses spans
      # também não têm uso.
      spring.security: false

server:
  port: ${SERVER_PORT:8080}
  error:
    # Defesa em profundidade: o ProblemDetailsErrorController já não expõe nada disso.
    include-stacktrace: never
    include-message: never
    include-exception: false

springdoc:
  # Exposição deliberada (lista pública do ADR-0005), não default esquecido.
  api-docs:
    enabled: true
    version: openapi_3_1
  swagger-ui:
    enabled: true
  # Fica false de vez: com true, o springdoc remove o ProblemDetail antes de o customizer de
  # 401/500 rodar, e as respostas passam a apontar para um schema que não existe.
  remove-broken-reference-definitions: false
  # Só a API de negócio; o /error do container e o Actuator ficam fora da documentação.
  paths-to-match: /api/**
