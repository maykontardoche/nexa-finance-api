# Textos dos erros (ADR-0004). Chave: problemDetail.{title|detail}.<slug do ProblemType>.
# O title descreve a classe do problema; o detail, o que o cliente pode fazer.
problemDetail.title.bad-request=Requisição malformada
problemDetail.detail.bad-request=Não foi possível processar a requisição. Verifique o corpo, os parâmetros e os cabeçalhos enviados.
problemDetail.title.validation-error=Requisição inválida
problemDetail.detail.validation-error=Um ou mais campos são inválidos.
problemDetail.title.unauthorized=Não autenticado
problemDetail.detail.unauthorized=É preciso se autenticar para acessar este recurso.
problemDetail.title.forbidden=Acesso negado
problemDetail.detail.forbidden=Você não tem permissão para acessar este recurso.
problemDetail.title.not-found=Recurso não encontrado
problemDetail.detail.not-found=O recurso solicitado não existe.
problemDetail.title.method-not-allowed=Método não permitido
problemDetail.detail.method-not-allowed=Este recurso não aceita o método HTTP usado.
problemDetail.title.unsupported-media-type=Tipo de conteúdo não suportado
problemDetail.detail.unsupported-media-type=Este recurso não aceita o Content-Type enviado.
problemDetail.title.internal-error=Erro interno
problemDetail.detail.internal-error=Ocorreu um erro inesperado. Se o problema persistir, informe o traceId ao suporte.
# Mensagem de item de errors[] quando a regra não tem texto próprio (ex.: valor que não converte para o tipo).
problemDetail.field.invalid-value=valor inválido
